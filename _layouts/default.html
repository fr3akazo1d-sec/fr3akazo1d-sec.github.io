<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="author" content="{{ page.author | default: site.author.name }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
    {% if page.layout == 'post' %}<link rel="stylesheet" href="{{ '/css/blog.css' | relative_url }}">{% endif %}
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
    <meta name="theme-color" content="#10141a">
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:image" content="{{ '/assets/images/avatar.png' | absolute_url }}">
    <meta property="og:site_name" content="{{ site.title }}">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@{{ site.author.twitter }}">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">
    <meta name="twitter:image" content="{{ '/assets/images/avatar.png' | absolute_url }}">

    <!-- SEO -->
    {% seo %}
    
    <!-- Feed -->
    {% feed_meta %}
</head>
<body>
    <!-- Skip to content (accessibility) -->
    <a href="#about" class="skip-to-content">Skip to content</a>

    <!-- Scroll Progress Bar -->
    <div class="scroll-progress-bar" id="scrollProgressBar"></div>

    <!-- Loading Screen -->
    <div class="loading-screen">
        <div class="loading-content">
            <div class="loading-logo glitch" data-text="F!">
                <span class="loading-f">F</span><span class="loading-exclaim">!</span>
            </div>
            <div class="loading-text">
                <span class="loading-prompt">fr3akazo1d@root:~#</span>
                <span class="loading-command">sudo su -</span>
            </div>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <div class="loading-status">Initializing root access...</div>
        </div>
    </div>

    <!-- Custom Cursor -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- CRT Scanline Overlay -->
    <div class="crt-overlay" aria-hidden="true"></div>

    <!-- HUD Widget -->
    <div id="hud" class="hud-widget" aria-hidden="true">
        <div class="hud-line"><span class="hud-label">SYS </span><span id="hud-time">--:--:--</span></div>
        <div class="hud-line"><span class="hud-label">UPT </span><span id="hud-uptime">00:00</span></div>
        <div class="hud-line hud-conn"><span class="hud-dot"></span>CONN ENCRYPTED</div>
    </div>

    {{ content }}

    <!-- JavaScript -->
    <script src="{{ '/js/main.js' | relative_url }}"></script>
</body>
</html>
