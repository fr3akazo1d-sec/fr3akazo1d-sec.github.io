name: Site CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate data files
        run: ruby scripts/validate_data.rb

      - name: Build site
        run: bundle exec jekyll build --trace